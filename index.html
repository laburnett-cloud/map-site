<body>
    <!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>Locations</title>

<link
 rel="stylesheet"
 href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

html,
body,
#map {
  height:100%;
  width:100%;
  margin:0;
}

</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map')
.setView([42.36,-71.10],10);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  maxZoom:19
}
).addTo(map);

fetch("https://script.google.com/macros/s/AKfycbzYm-wqJuIBaw44tityaLUOARImTd55uF27gFa9IzDVsjUPc15Paess0JtRYIMBNM3xNw/exec")
.then(r => r.json())
.then(data => {

  const layer =
    L.geoJSON(data, {

      onEachFeature:
      function(feature, layer) {

        const popup =

          '<b>' +
          feature.properties.name +
          '</b><br>' +

          feature.properties.address;

        layer.bindPopup(popup);

      }

    });

  layer.addTo(map);

});

</script>

</body>
</html>
