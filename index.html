<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>ICE Sighting Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,
body,
#map {

  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;

}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
  [42.35, -71.55],
  8
);

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19
  }
).addTo(map);

fetch(

  "https://script.google.com/macros/s/AKfycbwYPhyRkv6vJwgSkM3iawt9mlBuj7mmH5oItxf7TwSC81r-m_c3WwpAhkVMkXFmMhq4Sg/exec?t="

  + Date.now()

)

.then(response => response.json())

.then(data => {

  console.log(data);
  console.log(
  JSON.stringify(data, null, 2)
);
function getAgeDays(timestamp) {
  const now = new Date();
  const t = new Date(timestamp);
  return (now - t) / (1000 * 60 * 60 * 24);
}

function getOpacity(age) {
  if (age <= 2) return 1;
  if (age >= 14) return 0;
  return 1 - ((age - 2) / 12);
}

const markers = L.geoJSON(data, {

  pointToLayer: function (feature, latlng) {

    const age = getAgeDays(feature.properties.timestamp);

    // 🚫 kill old points completely
    if (age >= 14) {
      opacity = 0
    };

    const isCluster = feature.properties.isCluster;

    const hasDesc =
      feature.properties.description &&
      feature.properties.description.trim() !== "";

    // 🎨 COLOR RULES
    let color;

    if (isCluster) {
      color = "green";
    } else {
      color = hasDesc ? "green" : "red";
    }

    const opacity = getOpacity(age);

    return L.circleMarker(latlng, {

      radius: isCluster ? 9 : 6,

      fillColor: color,
      color: color,

      weight: 1,

      fillOpacity: opacity,
      opacity: opacity

    });
  },

  onEachFeature: function (feature, layer) {

    const age = Math.floor(getAgeDays(feature.properties.timestamp));

    const popup =
      "<b>" + feature.properties.title + "</b><br><br>" +
      feature.properties.address + "<br><br>" +
      feature.properties.description + "<br><br>" +
      "<small>" + age + " days old</small>";

    layer.bindPopup(popup);
  }

}).addTo(map);


  if (
    markers.getLayers().length > 0
  ) {

    map.fitBounds(
      markers.getBounds()
    );

  }

})

.catch(error => {

  console.error(
    error
  );

});

</script>

</body>

</html>
