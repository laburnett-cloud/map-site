<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>ICE Sighting Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

html,
body,
#map {

  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;

}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView(
  [42.35, -71.55],
  8
);

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19
  }
).addTo(map);

fetch(

  "https://script.google.com/macros/s/AKfycbyUTIiqnu5mXpjlJb4wDgoJ2GVPsAvatZK-Kd9wN6bUx8Y4WKJHNv7XPj9nJkXyp2OPUA/exec?t="

  + Date.now()

)

.then(response => response.json())

.then(data => {

  console.log(data);
  console.log(
  JSON.stringify(data, null, 2)
);
  const markers = L.geoJSON(
    data,

    {

      onEachFeature:
      function(feature, layer) {

        const popup =

          "<b>" +

          feature.properties.title +

          "</b><br><br>" +

          feature.properties.address +

          "<br><br>" +

          feature.properties.description;

        layer.bindPopup(
          popup
        );

      }

    }

  );

  markers.addTo(map);

  if (
    markers.getLayers().length > 0
  ) {

    map.fitBounds(
      markers.getBounds()
    );

  }

})

.catch(error => {

  console.error(
    error
  );

});

</script>

</body>

</html>
